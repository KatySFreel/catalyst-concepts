<!doctype html><meta charset="utf-8"><title>Каталист — просмотр концепции</title><style>body{margin:0;background:#dededb;font:13px Arial}nav{height:52px;display:flex;align-items:center;justify-content:center;gap:10px}button{padding:8px 15px;border:1px solid #bbb;background:#fff;border-radius:6px;cursor:pointer}#stage{margin:auto;position:relative}iframe{border:0;transform-origin:top left;background:#faf6ed}</style><nav><b>Концепция 6 · Фирменный стиль</b><button onclick="fit(1440)">Компьютер</button><button onclick="fit(768)">Планшет</button><button onclick="fit(390)">Телефон</button><a href="index.html">Открыть без рамки ↗</a></nav><div id="stage"><iframe src="index.html" title="Прототип Каталист"></iframe></div><script>let w=1440;function fit(n){w=n;const s=Math.min(1,(innerWidth-24)/w),f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=Math.max(650,(innerHeight-64)/s)+'px';f.style.transform=`scale(${s})`;document.getElementById('stage').style.width=w*s+'px';document.getElementById('stage').style.height=parseFloat(f.style.height)*s+'px'}onresize=()=>fit(w);fit(w)</script>
